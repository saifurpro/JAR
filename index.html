<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>জব এপ্লাই রিমাইন্ডার</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--ink:#1c2340;--paper:#e9ecf4;--tkt:#fff;--mut:#667090;--line:#c9cee0;--red:#d7263d;--redl:#fde8eb;--grn:#0b7a4b;--grnl:#dff3e8;--amb:#0b7a4b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Bengali','Kalpurush','Siyam Rupali','Nirmala UI','Hind Siliguri',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{background:var(--ink);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 26px;position:relative}
header h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.2px}
header p{margin:2px 0 0;font-size:14px;color:#aab2d3}
header::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;background:radial-gradient(circle at 15px 0,var(--paper) 7px,transparent 7.5px) 0 0/16px 16px repeat-x}
main{max-width:560px;margin:0 auto;padding:26px 14px 0}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bar.warn{background:#fff4e0;color:#6b3d05;border:1px solid #f0cf94}
.bar button{flex:none}
.panel{background:var(--tkt);border-radius:10px;padding:16px;margin-bottom:18px}
.panel>b{font-size:17px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 2px}
input{width:100%;padding:8px 2px;border:0;border-bottom:2px solid var(--line);border-radius:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
input:focus{outline:0;border-bottom-color:var(--ink)}
.row{display:flex;gap:14px}.row>div{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--ink);color:#fff;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
button.small{padding:6px 12px;font-size:14px}
button.del{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px #ecb3bb}
.bar button{background:#fff;color:var(--ink)}
.bar .x{background:transparent;color:inherit;padding:6px 8px;font-size:16px}
.bar .bs{display:flex;gap:6px;flex:none}
.full{width:100%;margin-top:18px;padding:12px;font-size:17px}
h2{font-size:15px;color:var(--mut);margin:22px 2px 10px;font-weight:700}

.tkt{display:flex;background:var(--tkt);border-radius:10px;margin-bottom:14px;position:relative;overflow:hidden}
.stub{flex:none;width:96px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center;position:relative}
.stub .n{font-size:44px;font-weight:800;line-height:1}
.stub .u{font-size:13px;margin-top:4px;color:#c3c9e6}
.stub::before,.stub::after{content:"";position:absolute;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper);z-index:2}
.stub::before{top:-9px}.stub::after{bottom:-9px}
.stub::after{}
.tkt::after{content:"";position:absolute;left:96px;top:10px;bottom:10px;border-left:2px dashed var(--line)}
.tkt.soon .stub{background:#8a4a07}
.tkt.late .stub{background:var(--red)}
.tkt.done .stub{background:var(--grn)}
.tkt.done .stub .n{font-size:40px}
.tkt.gone .stub{background:#8a90a8}
.tkt.done .body,.tkt.gone .body{opacity:.75}
.body{flex:1;min-width:0;padding:12px 14px 12px 18px}
.body h3{margin:0;font-size:19px;line-height:1.3;word-break:break-word}
.meta{font-size:13px;color:var(--mut);margin-top:2px}
.strip{display:flex;gap:2px;margin-top:10px;height:18px;align-items:flex-end}
.strip i{flex:1;min-width:0;height:8px;background:#e1e5f0;border-radius:2px}
.strip i.r{height:14px;background:var(--ink)}
.strip i.t{outline:2px solid var(--ink);outline-offset:1px}
.strip i.d{height:18px;background:var(--red)}
.strip i.pre{background:transparent;box-shadow:inset 0 -2px 0 #e1e5f0;height:8px}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:3px}
.next{font-size:13px;margin-top:6px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px;border:2px dashed var(--line);border-radius:10px;margin-bottom:18px}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.stat{font-size:13px;margin-top:10px;padding:8px 10px;background:var(--paper);border-radius:6px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .08s}}
</style>
</head>
<body>
<header><h1>জব এপ্লাই রিমাইন্ডার</h1><p>আবেদনের তারিখ আর কখনো মিস হবে না</p></header>
<main>
  <div id="installBar" class="bar" hidden><span id="installTxt">ফোনে অ্যাপ হিসেবে ইন্সটল করুন</span><span class="bs"><button id="installBtn" class="small">ইনস্টল</button><button id="installX" class="x" aria-label="বন্ধ করুন">✕</button></span></div>
  <div id="permBanner" class="bar warn" hidden><span>নোটিফিকেশন চালু করা নেই</span><button id="permBtn" class="small">চালু করুন</button></div>

  <div class="panel">
    <b>নতুন চাকরি</b>
    <label for="name">প্রতিষ্ঠানের নাম</label>
    <input id="name" placeholder="যেমন: বাংলাদেশ ব্যাংক" autocomplete="off">
    <div class="row">
      <div><label for="start">আবেদন শুরু</label><input id="start" type="date"></div>
      <div><label for="end">শেষ তারিখ</label><input id="end" type="date"></div>
    </div>
    <button id="add" class="full">যোগ করুন</button>
  </div>

  <div id="list"></div>

  <div class="panel">
    <b>সেটিংস</b>
    <div class="row">
      <div><label for="tm">সকালের সময়</label><input id="tm" type="time" value="08:00"></div>
      <div><label for="te">বিকেল / সন্ধ্যার সময়</label><input id="te" type="time" value="19:00"></div>
    </div>
    <div class="acts"><button id="testBtn" class="ghost small">টেস্ট নোটিফিকেশন</button></div>
    <div id="stat" class="stat"></div>
    <p class="note">নেট ছাড়াই অ্যাপ চলে। সব তথ্য শুধু এই ফোনের ভেতরে থাকে।</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const bn = n => Number(n).toLocaleString('bn-BD');

let jobs = load('jobs', []);
let cfg = load('cfg', { m: '08:00', e: '19:00' });
let fired = load('fired', {});
let reg = null, deferred = null;

$('tm').value = cfg.m; $('te').value = cfg.e;

const day0 = s => new Date(s + 'T00:00:00');
const today0 = () => new Date(new Date().setHours(0, 0, 0, 0));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const diffDays = (a, b) => Math.round((a - b) / 864e5);
const withTime = (d, t) => { const [h, m] = t.split(':'); const x = new Date(d); x.setHours(+h, +m, 0, 0); return x };
const fmtDate = s => day0(s).toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDT = d => d.toLocaleString('bn-BD', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

// শুরুর পরের দিন, তারপর একদিন পর পর; শেষ ৭ দিনে প্রতিদিন; দিনে দুইবার
function schedule(j) {
  const s = day0(j.start), e = day0(j.end);
  let first = addDays(s, 1); if (first > e) first = e;
  const out = [];
  for (let d = new Date(first); d <= e; d = addDays(d, 1)) {
    if (diffDays(e, d) <= 7 || diffDays(d, first) % 2 === 0) out.push(withTime(d, cfg.m), withTime(d, cfg.e));
  }
  return out;
}

async function notify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, icon: 'icon-192.png', badge: 'icon-192.png' };
  try { if (reg) await reg.showNotification(title, opts); else new Notification(title, opts); }
  catch (e) { try { new Notification(title, opts) } catch {} }
}

function msgFor(j) {
  const left = diffDays(day0(j.end), today0());
  const when = left < 0 ? 'সময় শেষ' : left === 0 ? 'আজই শেষ দিন!' : `আর ${bn(left)} দিন বাকি`;
  return [`আবেদন করুন: ${j.name}`, `${when} — শেষ তারিখ ${fmtDate(j.end)}`];
}

function tick() {
  const now = new Date(); let changed = false;
  jobs.filter(j => !j.applied).forEach(j => {
    const due = schedule(j).filter(t => t <= now);
    if (!due.length) return;
    const latest = due[due.length - 1], key = j.id + '_' + latest.getTime();
    if (fired[key]) return;
    due.forEach(t => fired[j.id + '_' + t.getTime()] = 1); changed = true;
    if (day0(j.end) < today0()) return;
    const [t, b] = msgFor(j); notify(t, b, key);
  });
  if (changed) save('fired', fired);
}

// IndexedDB: সার্ভিস ওয়ার্কার ব্যাকগ্রাউন্ডে এখান থেকে চাকরির তথ্য পড়ে
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('jr', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbSet = async (k, v) => { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} };
const mirror = () => idbSet('data', { jobs, cfg });

async function regPeriodic() {
  try {
    if (!reg || !('periodicSync' in reg)) return false;
    const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if (st.state !== 'granted') return false;
    await reg.periodicSync.register('check-reminders', { minInterval: 60 * 60 * 1000 });
    return true;
  } catch (e) { return false; }
}

function status(j) {
  const left = diffDays(day0(j.end), today0());
  if (j.applied) return { cls: 'done', n: '✓', u: 'আবেদন করা হয়েছে' };
  if (left < 0) return { cls: 'gone', n: bn(Math.abs(left)), u: 'দিন আগে শেষ' };
  if (left === 0) return { cls: 'late', n: 'আজ', u: 'শেষ দিন' };
  return { cls: left <= 7 ? 'soon' : '', n: bn(left), u: 'দিন বাকি' };
}

function stripFor(j) {
  const t0 = today0(), e = day0(j.end), s = day0(j.start);
  const days = new Set(schedule(j).map(d => d.toDateString()));
  const last = Math.min(diffDays(e, t0), 29);
  if (last < 0) return '';
  let h = '';
  for (let i = 0; i <= last; i++) {
    const d = addDays(t0, i), isEnd = d.getTime() === e.getTime();
    let c = isEnd ? 'd' : days.has(d.toDateString()) && !j.applied ? 'r' : d < s ? 'pre' : '';
    if (i === 0) c += ' t';
    h += `<i class="${c}"></i>`;
  }
  const more = diffDays(e, t0) > 29;
  return `<div class="strip">${h}</div><div class="legend"><span>আজ</span><span>${more ? 'আগামী ৩০ দিন ›' : 'শেষ: ' + fmtDate(j.end)}</span></div>`;
}

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  const el = $('list');
  if (!jobs.length) { el.innerHTML = '<div class="empty">কোনো চাকরি নেই।<br>উপরে নাম আর তারিখ দিয়ে প্রথমটা যোগ করুন।</div>'; return; }
  const pend = jobs.filter(j => !j.applied).sort((a, b) => a.end.localeCompare(b.end));
  const done = jobs.filter(j => j.applied);
  const now = new Date();
  const card = j => {
    const st = status(j);
    const next = j.applied ? null : schedule(j).find(t => t > now);
    return `<div class="tkt ${st.cls}">
      <div class="stub"><div class="n">${st.n}</div><div class="u">${st.u}</div></div>
      <div class="body">
        <h3>${esc(j.name)}</h3>
        <div class="meta">শুরু ${fmtDate(j.start)} · শেষ ${fmtDate(j.end)}</div>
        ${j.applied ? '' : stripFor(j)}
        ${next ? `<div class="next">পরের রিমাইন্ডার: ${fmtDT(next)}</div>` : ''}
        <div class="acts">
          ${j.applied ? `<button class="ghost small" data-undo="${j.id}">আবার চালু করুন</button>` : `<button class="small" data-done="${j.id}">✓ আবেদন করেছি</button>`}
          <button class="del small" data-del="${j.id}">মুছুন</button>
        </div>
      </div></div>`;
  };
  el.innerHTML = (pend.length ? `<h2>বাকি আছে · ${bn(pend.length)}টি</h2>` + pend.map(card).join('') : '') +
    (done.length ? `<h2>আবেদন হয়ে গেছে · ${bn(done.length)}টি</h2>` + done.map(card).join('') : '');
}

function persist() { save('jobs', jobs); render(); mirror(); }

$('add').onclick = () => {
  const name = $('name').value.trim(), start = $('start').value, end = $('end').value;
  if (!name || !start || !end) return alert('প্রতিষ্ঠানের নাম, শুরুর তারিখ ও শেষ তারিখ—তিনটিই দিন।');
  if (end < start) return alert('শেষ তারিখ শুরুর তারিখের আগে হতে পারে না।');
  jobs.push({ id: Date.now().toString(36), name, start, end, applied: false });
  $('name').value = ''; $('start').value = ''; $('end').value = '';
  persist(); tick();
};
$('list').onclick = e => {
  const t = e.target;
  if (t.dataset.done) { jobs.find(j => j.id === t.dataset.done).applied = true; persist(); }
  else if (t.dataset.undo) { jobs.find(j => j.id === t.dataset.undo).applied = false; persist(); }
  else if (t.dataset.del && confirm('এটি মুছে ফেলবেন?')) { jobs = jobs.filter(j => j.id !== t.dataset.del); persist(); }
};
['tm', 'te'].forEach(id => $(id).onchange = () => { cfg = { m: $('tm').value || '08:00', e: $('te').value || '19:00' }; save('cfg', cfg); render(); mirror(); });

let bgOn = false;
function permUI() { $('permBanner').hidden = !('Notification' in window) || Notification.permission === 'granted'; statUI(); }
function statUI() {
  $('stat').textContent = bgOn
    ? 'ব্যাকগ্রাউন্ড চেক চালু আছে: অ্যাপ বন্ধ থাকলেও ফোন মাঝেমধ্যে চেক করে রিমাইন্ডার দেখাতে পারে। তবে ঠিক নির্ধারিত সময়ে আসার নিশ্চয়তা নেই, দেরি হতে পারে।'
    : 'ব্যাকগ্রাউন্ড চেক চালু হয়নি: অ্যাপ খোলা বা ব্যাকগ্রাউন্ডে থাকলে নোটিফিকেশন আসবে। বন্ধ থাকলে পরের বার খুললে মিস হওয়া রিমাইন্ডার দেখাবে।';
}
$('permBtn').onclick = async () => {
  if (!('Notification' in window)) return alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।');
  if (Notification.permission === 'denied') return alert('নোটিফিকেশন ব্লক করা আছে। ফোনের সেটিংস > অ্যাপ > জব রিমাইন্ডার > নোটিফিকেশন থেকে চালু করুন।');
  await Notification.requestPermission(); permUI();
};
$('testBtn').onclick = async () => {
  if (!('Notification' in window)) return alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।');
  if (Notification.permission !== 'granted') await Notification.requestPermission();
  permUI(); notify('জব এপ্লাই রিমাইন্ডার', 'নোটিফিকেশন ঠিকমতো কাজ করছে ✓', 'test');
};

// ইনস্টল বার: শুধু তখনই দেখায় যখন ব্রাউজার ইনস্টল প্রম্পট দিতে পারে এবং অ্যাপ এখনো ইনস্টল করা নয়
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
try { localStorage.removeItem('installDismissed'); } catch {}  // আগের ভার্সনে সেভ হওয়া পুরোনো ফ্ল্যাগ মুছে দেয়
let dismissed = false;  // ✕ চাপলে শুধু এই খোলার সময়টুকুর জন্য লুকায়, রিলোড দিলে আবার আসে
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone && !dismissed) $('installBar').hidden = false; });
$('installBtn').onclick = async () => {
  if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('installBar').hidden = true; }
};
$('installX').onclick = () => { $('installBar').hidden = true; dismissed = true; };
window.addEventListener('appinstalled', () => { $('installBar').hidden = true; });
if (!standalone && !dismissed && /iphone|ipad/i.test(navigator.userAgent)) {
  $('installTxt').textContent = 'ইনস্টল করতে Safari-তে Share চেপে "Add to Home Screen" দিন';
  $('installBtn').hidden = true; $('installBar').hidden = false;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(async r => { reg = r; mirror(); bgOn = await regPeriodic(); statUI(); }).catch(() => {});
}
mirror();
permUI(); render(); tick();
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });
</script>
</body>
</html>
