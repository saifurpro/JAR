<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>জব এপ্লাই রিমাইন্ডার</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#14532d">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f2;--ink:#14232a;--mut:#5b6b66;--card:#fff;--line:#dde4dc;--g:#14532d;--gl:#e3f1e7;--warn:#b45309;--wl:#fdf0dc;--red:#b91c1c;--rl:#fde6e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:40px}
header{background:var(--g);color:#f4f6f2;padding:18px 16px 16px}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;font-size:14px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:14px}
.banner{background:var(--wl);border:1px solid #f0d49a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner button{margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--g);color:#fff}
button.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}
button.small{padding:6px 10px;font-size:14px}
button.del{background:transparent;color:var(--red);border:1px solid #e6b8b3}
.full{width:100%;margin-top:14px}
h2{font-size:17px;margin:18px 0 8px}
.job{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:10px;padding:12px;margin-bottom:10px}
.job.soon{border-left-color:var(--warn)}.job.late{border-left-color:var(--red)}.job.done{border-left-color:#9db3a5;opacity:.7}
.job h3{margin:0 0 4px;font-size:18px}
.meta{font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;background:var(--gl);color:var(--g);font-weight:600;margin-top:6px}
.soon .tag{background:var(--wl);color:var(--warn)}.late .tag{background:var(--rl);color:var(--red)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
details{margin-top:8px}summary{cursor:pointer;color:var(--g);font-weight:600}
.note{font-size:13px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<header><h1>জব এপ্লাই রিমাইন্ডার</h1><p>আবেদনের তারিখ আর কখনো মিস হবে না</p></header>
<main>
  <div id="permBanner" class="banner" hidden>
    নোটিফিকেশন চালু করা নেই।
    <br><button id="permBtn" class="small">নোটিফিকেশন চালু করুন</button>
  </div>

  <div class="panel">
    <b>নতুন চাকরি যোগ করুন</b>
    <label for="name">প্রতিষ্ঠানের নাম</label>
    <input id="name" placeholder="যেমন: বাংলাদেশ ব্যাংক">
    <div class="row">
      <div><label for="start">আবেদন শুরু</label><input id="start" type="date"></div>
      <div><label for="end">শেষ তারিখ</label><input id="end" type="date"></div>
    </div>
    <button id="add" class="full">যোগ করুন</button>
  </div>

  <div id="list"></div>

  <div class="panel">
    <b>সেটিংস</b>
    <div class="row">
      <div><label for="tm">সকালের সময়</label><input id="tm" type="time" value="08:00"></div>
      <div><label for="te">সন্ধ্যার সময়</label><input id="te" type="time" value="19:00"></div>
    </div>
    <div class="acts">
      <button id="testBtn" class="ghost small">টেস্ট নোটিফিকেশন</button>
      <button id="icsBtn" class="small">ক্যালেন্ডারে রিমাইন্ডার নিন (.ics)</button>
    </div>
    <p class="note">অ্যাপ বন্ধ থাকলেও ফোনে রিমাইন্ডার পেতে সবচেয়ে নির্ভরযোগ্য উপায় হলো .ics ফাইলটি ফোনের ক্যালেন্ডারে ইমপোর্ট করা। নতুন চাকরি যোগ করলে বা আবেদন করে ফেললে আবার .ics নামিয়ে ইমপোর্ট করুন।</p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

let jobs = load('jobs', []);
let cfg = load('cfg', { m: '08:00', e: '19:00' });
let fired = load('fired', {});
let reg = null;

$('tm').value = cfg.m; $('te').value = cfg.e;

const day0 = s => new Date(s + 'T00:00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const diffDays = (a, b) => Math.round((a - b) / 864e5);
const withTime = (d, t) => { const [h, m] = t.split(':'); const x = new Date(d); x.setHours(+h, +m, 0, 0); return x };
const fmtDate = s => day0(s).toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtDT = d => d.toLocaleString('bn-BD', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

// নোটিফিকেশনের সময়সূচি: শুরুর পরের দিন, তারপর একদিন পর পর; শেষ ৭ দিনে প্রতিদিন; দিনে দুইবার
function schedule(j) {
  const s = day0(j.start), e = day0(j.end);
  let first = addDays(s, 1); if (first > e) first = e;
  const out = [];
  for (let d = new Date(first); d <= e; d = addDays(d, 1)) {
    const left = diffDays(e, d);
    if (left <= 7 || diffDays(d, first) % 2 === 0) {
      out.push(withTime(d, cfg.m), withTime(d, cfg.e));
    }
  }
  return out;
}

async function notify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, icon: 'icon.svg', badge: 'icon.svg', requireInteraction: false };
  try {
    if (reg) await reg.showNotification(title, opts); else new Notification(title, opts);
  } catch (e) { try { new Notification(title, opts) } catch {} }
}

function msgFor(j) {
  const left = diffDays(day0(j.end), new Date(new Date().setHours(0, 0, 0, 0)));
  const when = left < 0 ? 'সময় শেষ' : left === 0 ? 'আজই শেষ দিন!' : `আর ${left} দিন বাকি`;
  return [`আবেদন করুন: ${j.name}`, `${when} — শেষ তারিখ ${fmtDate(j.end)}`];
}

// অ্যাপ খোলা/ব্যাকগ্রাউন্ডে থাকলে সময় হলে নোটিফিকেশন দেখায়
function tick() {
  const now = new Date(); let changed = false;
  jobs.filter(j => !j.applied).forEach(j => {
    const due = schedule(j).filter(t => t <= now);
    if (!due.length) return;
    const latest = due[due.length - 1], key = j.id + '_' + latest.getTime();
    if (fired[key]) return;
    due.forEach(t => fired[j.id + '_' + t.getTime()] = 1); changed = true;
    if (day0(j.end) < new Date(now.toDateString())) return;
    const [t, b] = msgFor(j); notify(t, b, key);
  });
  if (changed) save('fired', fired);
}

// ব্রাউজার সাপোর্ট করলে ভবিষ্যতের নোটিফিকেশন আগেই শিডিউল করে রাখে (অ্যাপ বন্ধ থাকলেও কাজ করে)
async function syncTriggers() {
  if (!reg || !('showTrigger' in Notification.prototype) || typeof TimestampTrigger === 'undefined') return;
  if (Notification.permission !== 'granted') return;
  try {
    (await reg.getNotifications({ includeTriggered: true })).filter(n => n.tag && n.tag.startsWith('trg_')).forEach(n => n.close());
    const now = Date.now();
    for (const j of jobs.filter(x => !x.applied)) {
      const [t, b] = msgFor(j);
      for (const d of schedule(j)) {
        if (d.getTime() > now) await reg.showNotification(t, { body: b, tag: 'trg_' + j.id + '_' + d.getTime(), icon: 'icon.svg', showTrigger: new TimestampTrigger(d.getTime()) });
      }
    }
  } catch (e) {}
}

function status(j) {
  const today = new Date(new Date().setHours(0, 0, 0, 0));
  const left = diffDays(day0(j.end), today);
  if (j.applied) return { cls: 'done', tag: '✓ আবেদন করা হয়েছে' };
  if (left < 0) return { cls: 'late', tag: 'সময় শেষ' };
  if (left === 0) return { cls: 'late', tag: 'আজই শেষ দিন' };
  if (left <= 7) return { cls: 'soon', tag: `আর ${left} দিন বাকি` };
  return { cls: '', tag: `আর ${left} দিন বাকি` };
}

function render() {
  const el = $('list');
  if (!jobs.length) { el.innerHTML = '<div class="empty">এখনো কোনো চাকরি যোগ করা হয়নি।<br>উপরে প্রতিষ্ঠানের নাম আর তারিখ দিন।</div>'; return; }
  const pend = jobs.filter(j => !j.applied).sort((a, b) => a.end.localeCompare(b.end));
  const done = jobs.filter(j => j.applied);
  const now = new Date();
  const card = j => {
    const st = status(j);
    const next = j.applied ? null : schedule(j).find(t => t > now);
    return `<div class="job ${st.cls}">
      <h3>${esc(j.name)}</h3>
      <div class="meta">শুরু: ${fmtDate(j.start)} · শেষ: ${fmtDate(j.end)}</div>
      <span class="tag">${st.tag}</span>
      ${next ? `<div class="meta" style="margin-top:6px">পরের রিমাইন্ডার: ${fmtDT(next)}</div>` : ''}
      <div class="acts">
        ${j.applied ? `<button class="ghost small" data-undo="${j.id}">আবার চালু করুন</button>` : `<button class="small" data-done="${j.id}">✓ আবেদন করেছি</button>`}
        <button class="del small" data-del="${j.id}">মুছুন</button>
      </div></div>`;
  };
  el.innerHTML = (pend.length ? `<h2>বাকি আছে (${pend.length})</h2>` + pend.map(card).join('') : '') +
    (done.length ? `<h2>আবেদন করা হয়েছে (${done.length})</h2>` + done.map(card).join('') : '');
}
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function persist() { save('jobs', jobs); render(); syncTriggers(); }

$('add').onclick = () => {
  const name = $('name').value.trim(), start = $('start').value, end = $('end').value;
  if (!name || !start || !end) return alert('প্রতিষ্ঠানের নাম, শুরুর তারিখ ও শেষ তারিখ—তিনটিই দিন।');
  if (end < start) return alert('শেষ তারিখ শুরুর তারিখের আগে হতে পারে না।');
  jobs.push({ id: Date.now().toString(36), name, start, end, applied: false });
  $('name').value = ''; $('start').value = ''; $('end').value = '';
  persist(); tick();
};
$('list').onclick = e => {
  const t = e.target;
  if (t.dataset.done) { jobs.find(j => j.id === t.dataset.done).applied = true; persist(); }
  else if (t.dataset.undo) { jobs.find(j => j.id === t.dataset.undo).applied = false; persist(); }
  else if (t.dataset.del && confirm('এটি মুছে ফেলবেন?')) { jobs = jobs.filter(j => j.id !== t.dataset.del); persist(); }
};
['tm', 'te'].forEach(id => $(id).onchange = () => { cfg = { m: $('tm').value || '08:00', e: $('te').value || '19:00' }; save('cfg', cfg); render(); syncTriggers(); });

function permUI() { $('permBanner').hidden = !('Notification' in window) || Notification.permission === 'granted'; }
$('permBtn').onclick = async () => {
  if (!('Notification' in window)) return alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।');
  await Notification.requestPermission(); permUI(); syncTriggers();
};
$('testBtn').onclick = async () => {
  if (!('Notification' in window)) return alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।');
  if (Notification.permission !== 'granted') await Notification.requestPermission();
  permUI(); notify('জব এপ্লাই রিমাইন্ডার', 'নোটিফিকেশন ঠিকমতো কাজ করছে ✓', 'test');
};

// .ics: ফোনের ক্যালেন্ডার অ্যাপ অ্যাপ বন্ধ থাকলেও অ্যালার্ম দেয়
$('icsBtn').onclick = () => {
  const z = n => String(n).padStart(2, '0');
  const f = d => `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`;
  const stamp = f(new Date());
  const now = new Date(); let ev = '';
  jobs.filter(j => !j.applied).forEach(j => {
    const [t, b] = msgFor(j);
    schedule(j).filter(d => d > now).forEach(d => {
      ev += `BEGIN:VEVENT\r\nUID:${j.id}-${d.getTime()}@job-apply-reminder\r\nDTSTAMP:${stamp}\r\nDTSTART:${f(d)}\r\nDTEND:${f(new Date(d.getTime() + 15 * 60000))}\r\nSUMMARY:${t.replace(/[,;]/g, ' ')}\r\nDESCRIPTION:${b.replace(/[,;]/g, ' ')}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${t.replace(/[,;]/g, ' ')}\r\nTRIGGER:PT0S\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
    });
  });
  if (!ev) return alert('রিমাইন্ডার বানানোর মতো বাকি কোনো চাকরি নেই।');
  const blob = new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//job-apply-reminder//BN\r\n${ev}END:VCALENDAR`], { type: 'text/calendar' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'job-reminders.ics'; a.click();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r => { reg = r; syncTriggers(); }).catch(() => {});
permUI(); render(); tick();
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });
</script>
</body>
</html>
